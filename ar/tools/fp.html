<!doctype html><meta charset="utf-8">
<script type="module">
import '../node_modules/mind-ar/dist/mindar-image.prod.js';
import tgt from '../app/targets/penguin-target.js';
const bin = Uint8Array.from(atob(tgt), c => c.charCodeAt(0));
const url = URL.createObjectURL(new Blob([bin]));
const W = 720, H = 960;
const out = [];
for (const src of ['../fixtures/penguin_page.png', '../fixtures/kid_name_susan.png']) {
  const img = new Image(); img.src = src; await img.decode();
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d'); g.fillStyle = '#7a5a3a'; g.fillRect(0, 0, W, H);
  const s = Math.min(W / img.width, H / img.height) * 0.9; const w = img.width * s, h = img.height * s;
  g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  const c = new window.MINDAR.IMAGE.Controller({ inputWidth: W, inputHeight: H, maxTrack: 1 });
  await c.addImageTargets(url);
  const { featurePoints } = await c.detect(cv);
  const r = await c.match(featurePoints, 0);
  out.push({ src, pts: featurePoints.map(p => [Math.round(p.x), Math.round(p.y)]), matched: !!r.modelViewTransform, extra: r.debugExtra && r.debugExtra.frames ? r.debugExtra.frames.map(f => Object.fromEntries(Object.entries(f).filter(([k, v]) => typeof v === 'number' || (Array.isArray(v) && typeof v[0] !== 'object')).map(([k, v]) => [k, Array.isArray(v) ? v.length : v]))) : null });
  const d = cv.toDataURL(); out[out.length - 1].img = d;
}
window.result = out; window.done = true;
</script>
