<!doctype html><meta charset="utf-8">
<script type="module">
import '../node_modules/mind-ar/dist/mindar-image.prod.js';
const img = new Image(); img.src = '../fixtures/penguin_page.png';
await img.decode();
const c = new window.MINDAR.IMAGE.Compiler();
const t0 = performance.now();
await c.compileImageTargets([img], p => { window.progress = p; });
const buf = await c.exportData();
let s = ''; const u = new Uint8Array(buf);
for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
window.result = btoa(s); window.ms = performance.now() - t0;
</script>
