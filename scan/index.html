<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a1c15">
<link rel="icon" href="../brand/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../brand/icon-180.png">
<meta name="robots" content="noindex">
<title>MaryMariiArt Magic Scanner</title>
<style>
@font-face { font-family: Gluten; font-weight: 800; font-display: swap; src: url(fonts/gluten-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: Gluten; font-weight: 700; font-display: swap; src: url(fonts/gluten-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: Figtree; font-weight: 500; font-display: swap; src: url(fonts/figtree-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: Figtree; font-weight: 600; font-display: swap; src: url(fonts/figtree-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: Figtree; font-weight: 700; font-display: swap; src: url(fonts/figtree-latin-700-normal.woff2) format("woff2"); }
:root {
  color-scheme: dark;
  --ink: #2a1c15; --paper: #fffcf6; --red: #e0574c; --teal: #7fbfb8; --sun: #f2c14e;
  --display: "Gluten", "Chalkboard SE", "Comic Sans MS", cursive;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--paper); font: 16px/1.4 var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
video#cam { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

.top { position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(rgba(0,0,0,.45), transparent); pointer-events: none; }
.brand { font: 800 1.25rem var(--display); display: flex; align-items: center; gap: 7px; }
.brand img { height: 34px; width: auto; filter: drop-shadow(0 1px 3px rgba(0,0,0,.45)); }
.sheet-name { font-weight: 700; font-size: .9rem; background: rgba(0,0,0,.35); padding: 6px 12px; border-radius: 999px; }

.hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 138px); transform: translateX(-50%); background: rgba(42,28,21,.82); padding: 10px 18px; border-radius: 999px;
  font-weight: 700; text-align: center; max-width: calc(100% - 40px); transition: opacity .3s; }
.hint[hidden] { display: block !important; opacity: 0; }
.frame { position: fixed; left: 50%; top: 46%; width: min(64vw, 46vh); aspect-ratio: 210 / 297; transform: translate(-50%, -50%); border-radius: 18px; pointer-events: none;
  background:
    linear-gradient(var(--paper), var(--paper)) top left / 34px 5px no-repeat, linear-gradient(var(--paper), var(--paper)) top left / 5px 34px no-repeat,
    linear-gradient(var(--paper), var(--paper)) top right / 34px 5px no-repeat, linear-gradient(var(--paper), var(--paper)) top right / 5px 34px no-repeat,
    linear-gradient(var(--paper), var(--paper)) bottom left / 34px 5px no-repeat, linear-gradient(var(--paper), var(--paper)) bottom left / 5px 34px no-repeat,
    linear-gradient(var(--paper), var(--paper)) bottom right / 34px 5px no-repeat, linear-gradient(var(--paper), var(--paper)) bottom right / 5px 34px no-repeat;
  opacity: .85; animation: breathe 1.8s ease-in-out infinite; transition: opacity .3s; }
.frame[hidden] { display: block !important; opacity: 0; animation: none; }
@keyframes breathe { 50% { transform: translate(-50%, -50%) scale(1.03); } }

.magic { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
.magic svg { width: 120px; height: 120px; }
.magic circle.track { fill: none; stroke: rgba(255,255,255,.25); stroke-width: 10; }
.magic circle.fill { fill: none; stroke: var(--sun); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 327; stroke-dashoffset: 327; transform: rotate(-90deg); transform-origin: center; }
.magic.run circle.fill { animation: ring 1.3s linear forwards; }
.magic p { font: 800 1.6rem var(--display); margin: 6px 0 0; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
@keyframes ring { to { stroke-dashoffset: 0; } }

.bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 22px); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  background: linear-gradient(transparent, rgba(0,0,0,.5)); }
.rec { width: 82px; height: 82px; border-radius: 50%; border: 5px solid var(--paper); background: transparent; display: grid; place-items: center; padding: 0; position: relative; }
.rec span { width: 58px; height: 58px; border-radius: 50%; background: var(--red); transition: all .2s; }
.rec.on span { width: 30px; height: 30px; border-radius: 8px; }
.rec:disabled { opacity: .4; }
.rec svg { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); transform: rotate(-90deg); }
.rec svg circle { fill: none; stroke: var(--sun); stroke-width: 5; stroke-dasharray: 289; stroke-dashoffset: 289; }
.side { justify-self: start; background: rgba(0,0,0,.35); border: 0; color: var(--paper); font-weight: 700; padding: 10px 14px; border-radius: 999px; font-size: .9rem; }
.side.right { justify-self: end; }
.timer { justify-self: end; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--red); padding: 6px 12px; border-radius: 999px; }

.sheet { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(42,28,21,.94); z-index: 10; }
.sheet[hidden] { display: none; }
.card { width: min(420px, 100%); background: var(--paper); color: var(--ink); border-radius: 28px; padding: 28px 24px 24px; text-align: center; }
.card h1 { font: 800 2.1rem/1.05 var(--display); margin: 8px 0 10px; text-wrap: balance; }
.card p { margin: 0 0 18px; color: #6d5d53; }
.card .big { display: block; width: 100%; padding: 16px; border-radius: 999px; border: 2.5px solid var(--ink); background: var(--red); color: #fff; font-weight: 800; font-size: 1.1rem; box-shadow: 3px 3px 0 var(--ink); margin-top: 10px; }
.card .ghost { display: block; width: 100%; padding: 13px; border-radius: 999px; border: 2px solid var(--ink); background: transparent; color: var(--ink); font-weight: 700; margin-top: 12px; }
.card small { display: block; margin-top: 16px; color: #8a7a70; font-size: .82rem; }
.steps { display: flex; justify-content: center; gap: 10px; margin: 6px 0 18px; }
.steps span { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: var(--paper); font: 800 1.1rem var(--display); }
.steps span:nth-child(2) { background: var(--red); } .steps span:nth-child(3) { background: var(--teal); color: var(--ink); }
.result video { width: 100%; max-height: 52vh; border-radius: 18px; background: #000; display: block; margin-bottom: 14px; object-fit: contain; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row .big, .row .ghost { margin-top: 0; }
.err { color: var(--red) !important; font-weight: 700; }
input[type=file] { display: none; }
@media (prefers-reduced-motion: reduce) { .frame { animation: none; } }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="gl" aria-label="Camera view with your drawing coming to life"></canvas>

<div class="top"><a class="brand" href="../index.html" style="color:inherit;text-decoration:none;pointer-events:auto"><img src="../brand/lockup-white.png" alt="MaryMarii"></a><span class="sheet-name" id="sheet-name">Penguin</span></div>
<div class="frame" id="frame" hidden></div>
<div class="hint" id="hint" hidden>Point the camera at your Penguin page</div>
<div class="magic" id="magic" hidden><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/><circle class="fill" cx="60" cy="60" r="52"/></svg><p>Hold still…</p></div>

<div class="bottom" id="controls" hidden>
  <button class="side" id="again" type="button">↻ Again</button>
  <button class="rec" id="rec" type="button" aria-label="Record a video" disabled><svg viewBox="0 0 102 102" aria-hidden="true"><circle cx="51" cy="51" r="46" id="rec-ring"/></svg><span></span></button>
  <span class="timer" id="timer" hidden>0:00</span>
  <button class="side right" id="photo-btn2" type="button">Photo</button>
</div>

<section class="sheet" id="start">
  <div class="card">
    <div class="steps" aria-hidden="true"><span>1</span><span>2</span><span>3</span></div>
    <h1 id="start-title">Make your penguin come alive!</h1>
    <p>Lay your colored page flat in good light, then point the camera at the whole page.</p>
    <button class="big" id="start-btn" type="button">Start the magic camera</button>
    <button class="ghost" id="photo-btn" type="button">Use a photo of the page instead</button>
    <p class="err" id="start-err" hidden></p>
    <small>Everything happens on this phone. Nothing is uploaded, and there's no sign-up.</small>
  </div>
</section>

<section class="sheet result" id="result" hidden>
  <div class="card">
    <video id="clip" playsinline controls loop></video>
    <div class="row"><button class="big" id="share" type="button">Save / Share</button><button class="ghost" id="retake" type="button">Record again</button></div>
    <p id="save-note" style="margin:12px 0 0;font-size:.85rem" hidden></p>
  </div>
</section>

<input type="file" id="file" accept="image/*">

<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
<script type="module" src="./app.js"></script>
</body>
</html>
