<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magic Bingo Caller · MaryMarii</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#c8382e">
<link rel="icon" href="../brand/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../brand/icon-180.png">
<style>
@font-face{font-family:Gluten;font-weight:800;font-display:swap;src:url(../fonts/gluten-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:Figtree;font-weight:700;font-display:swap;src:url(../fonts/figtree-latin-700-normal.woff2) format("woff2")}
:root{--ink:#2a1c15;--red:#c8382e;--green:#2f7d4f;--paper:#fffcf6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper) radial-gradient(#eadfd2 3px,transparent 3.6px) 0 0/34px 34px;color:var(--ink);font:700 16px/1.3 Figtree,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;width:100%}
header img{height:30px}
h1{font:800 clamp(28px,8vw,40px)/1 Gluten,cursive;color:var(--red);margin:10px 0 0;text-align:center}
.count{font-size:15px;opacity:.7;margin-top:4px}
.stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0}
.pic{height:min(46vh,340px);max-width:85%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(42,28,21,.18))}
.name{font:800 clamp(30px,9vw,46px)/1 Gluten,cursive;margin-top:14px;text-align:center}
.hint{font-size:18px;opacity:.75;text-align:center;max-width:300px}
.btn{border:0;border-radius:999px;font:800 26px Gluten,cursive;padding:18px 34px 14px;color:#fff;background:var(--green);box-shadow:0 6px 0 #1f5a37;width:100%;max-width:360px;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1f5a37}
.btn.bingo{background:var(--red);box-shadow:0 6px 0 #8e241d}
.row{display:flex;gap:10px;width:100%;max-width:360px;margin-top:12px}
.row .btn{font-size:22px;padding:14px 10px 10px}
.small{background:none;border:0;font:700 15px Figtree;color:var(--ink);opacity:.7;margin-top:10px;text-decoration:underline;cursor:pointer}
.called{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:44px;margin:10px 0 4px;max-width:100%}
.called img{height:40px;width:40px;object-fit:contain;background:#fff;border-radius:10px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.hop{animation:hop .7s ease-in-out .5s infinite}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-26px) scaleY(1.04)}55%{transform:translateY(0) scaleY(.94)}}
.swing{animation:swing 1.2s ease-in-out .5s infinite;transform-origin:50% 0}
@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.wiggle{animation:wiggle .9s ease-in-out .5s infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.dance{animation:dance 1s ease-in-out .5s infinite}
@keyframes dance{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-14px) rotate(-6deg) translateY(-8px)}50%{transform:translateX(0) rotate(0)}75%{transform:translateX(14px) rotate(6deg) translateY(-8px)}}
.party{position:fixed;inset:0;background:rgba(255,252,246,.94);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:5;overflow:hidden}
.party.on{display:flex}
.party h2{font:800 clamp(56px,18vw,96px)/1 Gluten,cursive;color:var(--red);margin:0;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both,wiggle 1s ease-in-out .6s infinite}
.party .crew{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:520px;margin:18px 0}
.party .crew img{height:min(15vw,78px);width:min(15vw,78px);object-fit:contain}
.conf{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
footer{font:700 11px Figtree;opacity:.5;margin-top:6px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="app">
  <header><img src="../brand/lockup-ink.png" alt="MaryMarii"><button class="small" id="snd" aria-pressed="true">🔊 Sound on</button></header>
  <h1>Magic Bingo Caller</h1>
  <div class="count" id="count">15 pictures in the hat</div>
  <div class="stage" id="stage">
    <div class="hint">Tap <b>Next picture</b> to call the first one. Cover it on your card if you have it!</div>
  </div>
  <div class="called" id="called" aria-label="Already called"></div>
  <button class="btn" id="next">Next picture</button>
  <div class="row"><button class="btn bingo" id="bingo">BINGO!</button></div>
  <button class="small" id="reset">New game</button>
  <footer>© MaryMarii · Works on any phone, no app, nothing is saved or sent.</footer>
</div>
<div class="party" id="party" role="dialog" aria-label="Bingo!">
  <h2>BINGO!</h2>
  <div class="crew" id="crew"></div>
  <button class="btn" id="back" style="max-width:300px">Keep playing</button>
  <button class="small" id="reset2">New game</button>
</div>
<script>
const P=[["bear","Polar Bear","dance"],["bell","Bell","swing"],["bunny","Bunny","hop"],["fox","Fox","wiggle"],["gift","Gift","hop"],["gingerbread","Gingerbread","dance"],["hedgehog","Hedgehog","hop"],["house","House","wiggle"],["owl","Owl","wiggle"],["penguin","Penguin","dance"],["reindeer","Reindeer","hop"],["santa","Santa","dance"],["snowman","Snowman","wiggle"],["stocking","Stocking","swing"],["tree","Tree","wiggle"]];
const $=id=>document.getElementById(id);let bag=[],calls=[],sound=true,ac=null;
P.forEach(p=>{const i=new Image();i.src=`img/${p[0]}.webp`});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tone(freqs,dur=.12,gap=.09){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*gap;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur+.25);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.3)})}catch(e){}}
function reset(){bag=shuffle(P.slice());calls=[];$("called").innerHTML="";$("stage").innerHTML='<div class="called" style="max-width:300px;margin-bottom:18px">'+P.slice(0,10).map(p=>`<img src="img/${p[0]}.webp" alt="">`).join("")+'</div><div class="hint">Tap <b>Next picture</b> to call the first one. Cover it on your card if you have it!</div>';$("count").textContent="15 pictures in the hat";$("next").disabled=false;$("next").textContent="Next picture";$("party").classList.remove("on")}
function next(){if(!bag.length)return;const p=bag.pop();calls.push(p);
 $("stage").innerHTML=`<div class="pop"><div class="${p[2]}"><img class="pic" src="img/${p[0]}.webp" alt="${p[1]}"></div></div><div class="name pop">${p[1]}</div>`;
 const t=document.createElement("img");t.src=`img/${p[0]}.webp`;t.alt=p[1];$("called").appendChild(t);
 $("count").textContent=bag.length?`${calls.length} called · ${bag.length} left in the hat`:"All 15 pictures called!";
 if(!bag.length){$("next").disabled=true;$("next").textContent="All called!"}
 tone([660,880]);}
function party(){$("crew").innerHTML=P.map((p,i)=>`<img class="${p[2]}" style="animation-delay:${(i%5)*.12}s" src="img/${p[0]}.webp" alt="">`).join("");
 $("party").classList.add("on");tone([523,659,784,1047],.16,.13);
 const cols=["#c8382e","#2f7d4f","#f2b632","#4a90d9","#e88aa8"];
 for(let i=0;i<70;i++){const c=document.createElement("i");c.className="conf";c.style.left=Math.random()*100+"vw";c.style.background=cols[i%5];c.style.animationDuration=(2+Math.random()*2.5)+"s";c.style.animationDelay=Math.random()*.8+"s";$("party").appendChild(c);setTimeout(()=>c.remove(),5000)}}
$("next").onclick=next;$("bingo").onclick=party;$("back").onclick=()=>$("party").classList.remove("on");
$("reset").onclick=$("reset2").onclick=()=>{if(!calls.length||confirm("Start a new game?"))reset()};
$("snd").onclick=e=>{sound=!sound;e.target.textContent=sound?"🔊 Sound on":"🔇 Sound off";e.target.setAttribute("aria-pressed",sound)};
reset();
</script>
</body>
</html>
